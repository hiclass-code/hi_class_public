Parameter file for the propto_omega_bh parametrization
 -> propto_omega extended with the beyond-Horndeski function alpha_H,
    all alphas proportional to the Dark Energy fraction
 -> See Traykova, Bellini & Ferreira 1902.10687

Omega_Lambda = 0
Omega_fld = 0
Omega_smg = -1

gravity_model = propto_omega_bh
                  c_K, c_B, c_M, c_T, c_H, M*^2_ini
parameters_smg =   1.,  0.5, 0.2,  0., 0.3,  1.

expansion_model = lcdm
expansion_smg = 0.5   #this is an initial guess for Omega_smg

NOTE on small scales: with alpha_H != 0 the perturbation equations can become
numerically stiff at early times for k >~ 0.5/Mpc, where the alphas are tiny
(proportional to Omega_smg) but the alpha_H terms are amplified by (k/aH)^4.
If the run fails with "Step size too small", either restrict P_k_max or set a
kineticity floor as below (it changes P(k) at the few-permille level):

kineticity_safe_smg = 1e-2

The default smg background sampling (background_Nloga = 3000) is too sparse
for the stiff alpha_H terms and this run then fails at high k even with the
kineticity floor; keep the dense upstream sampling (alternatively, restrict
P_k_max_1/Mpc <= 0.4):

background_Nloga = 40000


------ other parameters --------

root = output/propto_omega_bh_

output = tCl,mPk

write background = yes

input_verbose = 1
background_verbose = 1
output_verbose = 1
thermodynamics_verbose = 1
perturbations_verbose = 1
spectra_verbose = 1
