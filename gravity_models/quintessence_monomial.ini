# Example file for Monomial Quintessence dark energy.
# See: Marsh+ arXiv:1406.2301

# Quintessence theory: G_2 -> X - V(phi), G_4 -> M_p^2/2
# Monomial potential: V -> V0*(H0/h)^2 phi^N
# Notes:
# - phi can't cross zero
# - small phi_ini fails to get enough Omega_DE
# - phi_prime_ini -> 0 causes an artificial instability (alpha_k->0),
#   need to set small value or use a_min_stability_test_smg

# Switch on _smg fluid
Omega_Lambda = 0.
Omega_fld = 0.
Omega_smg = -1.

# For debugging purpouses one can specify a Omega_smg_debug
# AND unspecify Omega_smg,fld,Lambda so no shooting is done
# Omega_smg_debug = -1.

# Gravity model and parameters
gravity_model = quintessence_monomial
# Names:           N,  V0,  phi_prime_ini (H0), phi_ini
parameters_smg =  2.,  1.,                  0.,     10.

# Other parameters:
a_min_stability_test_smg = 1.e-10

# Output:
output = tCl, mPk 

root = output/quintessence_monomial
overwrite_root = yes

output_background_smg = 10
write parameters = yeap
write background = yeah
write thermodynamics = yeahh

input_verbose = 1
background_verbose = 1
thermodynamics_verbose = 1
perturbations_verbose = 1
transfer_verbose = 1
primordial_verbose = 1
harmonic_verbose = 1
fourier_verbose = 1
lensing_verbose = 1
distortions_verbose = 1
output_verbose = 1
