Parameter file for quartic GLPV (beyond Horndeski) Galileon with c_g = c
 -> See Traykova, Bellini & Ferreira 1902.10687 for the model
 -> See Renk+17 (1707.02263) and Barreira+14 (1406.0485) for details on cosmology
 -> See Ezquiaga+17 (1710.05901) eq 21 for the GW tuning

1) quartic GLPV Galileon: G_2 -> -X,
                          G_3 -> c_3 X/(H_0^2 M_p),
                          G_4 -> M_p^2/2 + c_4 X^2/(H_0^2 M_p)^2
                          F_4 -> -c_4/(H_0^2 M_p)^2
   Model specified by xi -> (H phi')/(a H0^2) ~ constant
   The submodel tunes b_4 = -c_4, fixing the GW speed (alpha_T = 0, see Ezquiaga+17)
   other model parameters fixed by Omega_smg and the tracker condition

NOTE: this example runs in Omega_smg_debug mode (the galileon evolves on top of
a LCDM background). The self-consistent setup, with Omega_Lambda and Omega_fld
set to zero and a negative Omega_smg, currently fails during the background
shooting for all galileon-family models in this version (evolver_ndf15
step-size error), a known issue unrelated to the GLPV terms. The quartic_cg
submodel uses Omega_smg to fix the tracker parameters, so in debug mode they
are set from Omega_smg_debug.

Omega_smg_debug = 0.75

gravity_model = glpv_galileon
gravity_submodel = quartic_cg
                   xi
parameters_smg =   2.43

skip_stability_tests_smg = yes
a_min_stability_test_smg = 1e-6


------ other parameters --------

root = output/glpv_gal4_cg_

#best fit values from Barreira+ (1406.0485)
H0 = 0.7629517E+02
omega_cdm = 0.1225734E+00
omega_b = 0.2174990E-01
tau_reio = 0.5781466E-01
A_s = 2.063174E-09
n_s = 0.9508897E+00

output = mPk

#with sizable alpha_H (here b_4 of order 0.1) the perturbation equations become
#numerically stiff for k above roughly 0.5/Mpc in this version; restrict the
#k-range until this is resolved
P_k_max_h/Mpc = 0.4

output_background_smg = 10
write background = yes

input_verbose = 1
background_verbose = 4
output_verbose = 1
thermodynamics_verbose = 1
perturbations_verbose = 1
spectra_verbose = 2
