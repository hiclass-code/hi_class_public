Parameter file for quartic GLPV (beyond Horndeski) Galileon
 -> See Traykova, Bellini & Ferreira 1902.10687 for the model
 -> See Renk+17 (1707.02263) and Barreira+14 (1406.0485) for details on cosmology
 -> See Ezquiaga+17 (1710.05901) eq 21 for the GW tuning

1) quartic GLPV Galileon: G_2 -> -X,
                          G_3 -> c_3 X/(H_0^2 M_p),
                          G_4 -> M_p^2/2 + c_4 X^2/(H_0^2 M_p)^2
                          F_4 -> b_4/(H_0^2 M_p)^2
   Model specified by xi -> (H phi')/(a H0^2) ~ constant
   The choice b_4 = -c_4 fixes the GW speed (alpha_T -> 0, see Ezquiaga+17)

NOTE: this example runs in Omega_smg_debug mode (the galileon evolves on top of
a LCDM background, no tuning of Omega_smg). The self-consistent setup, in which
the galileon is the dark energy (Omega_Lambda and Omega_fld set to zero, a
negative Omega_smg), currently fails during the background shooting for all
galileon-family models in this version (evolver_ndf15 step-size error), a known
issue unrelated to the GLPV terms.

Omega_smg_debug = 0.75

gravity_model = glpv_galileon
                    xi,  c1, c2, c3,   c4, c5,    b4, b5, phi_ini
parameters_smg =   2.5e2, 0, -5, -1,  1e-4, 0, -1e-4,  0,       0

skip_stability_tests_smg = yes
a_min_stability_test_smg = 1e-6


------ other parameters --------

root = output/glpv_gal4_

#best fit values from Barreira+ (1406.0485)
H0 = 0.7629517E+02
omega_cdm = 0.1225734E+00
omega_b = 0.2174990E-01
tau_reio = 0.5781466E-01
A_s = 2.063174E-09
n_s = 0.9508897E+00

output = mPk

output_background_smg = 10
write background = yes

input_verbose = 1
background_verbose = 4
output_verbose = 1
thermodynamics_verbose = 1
perturbations_verbose = 1
spectra_verbose = 2
