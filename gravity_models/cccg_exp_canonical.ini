Parameter file for the conformally coupled cubic galileon (cccg) with
exponential coupling, canonical branch (canonical kinetic term + cosmological constant).
Imperfect dark energy at equality -> See Zumalacarregui PRD 102 023523 (2020) [2003.06396]

Omega_Lambda = 0
Omega_fld = 0
Omega_smg = -1


1) conformally coupled cubic Galileon:
            G_2 -> c_2 X - 3 V_0 H_0^2,
            G_3 -> -2 c_3 X/(H_0^2 M_p),
            G_4 -> M_p^2/2 exp(beta phi)

            parameters (canonical branch):
            beta -> conformal coupling
            M*^2(a_ini) -> exp(beta phi_ini), sets the initial field value
            log10(Omega_smg(z=10^10)) -> sets the initial field velocity
            c_3 -> braiding term

            c_2 = 1 and V_0 is tuned to match Omega_smg today

gravity_model = cccg_exp
gravity_submodel = canonical
#                beta, M*^2(ini), log10(Omega_smg(z=10^10)), c3
parameters_smg =  0.0,   0.9,      -4,                       -1


2) Tune the effective Planck mass today, varying either the
   initial field value (tuning_index_2_smg = 1) or beta (tuning_index_2_smg = 4)

M2_tuning_smg = yes
M2_today_smg = 1.0
tuning_index_2_smg = 4


3) cccg runs into numerical problems at very early times: the field starts
   with Omega_smg ~ 1e-15, so the kinetic determinant D is at machine-noise
   level (~1e-13) and c_s^2 = (near-zero)/(near-zero) — its sign there is
   rounding noise, not physics. Start the stability test once D is resolved.
a_min_stability_test_smg = 1e-6

4) For the same reason, the superhorizon-attractor test for the scalar
   perturbation initial conditions (evaluated at z ~ 1e10 by default) sees
   only rounding noise and can spuriously flag a tachyonic instability.
   Start the perturbations from zero scalar-field ICs instead; the attractor
   establishes itself dynamically once the field is resolved.
pert_initial_conditions_smg = zero


------ other parameters --------

root = output/cccg_exp_canonical_

100*theta_s = 1.0411

#output = mPk
#k_output_values = 1e-4,1e-2,1

output_background_smg = 10
write parameters = yeap
write background = yeah

input_verbose = 4
background_verbose = 4
output_verbose = 1
thermodynamics_verbose = 1
perturbations_verbose = 1
spectra_verbose = 2
