# Example file for Tracker Quintessence dark energy.
# See: Amalgamation from different papers (e.g. see 9910214)

# Quintessence theory: G_2 -> X - V(phi), G_4 -> M_p^2/2
# Tracker potential:   V -> V0*(H0/h)^2*phi^(-n)*exp(lambda*(phi^m))
# Notes:
# - the model tracks the matter density initially
# - lambda -> the fraction of early DE: Omega_early ~ 1/lambda^2
# - K_ini, P_ini -> initial kinetic, potential energy (wrt radiation)
# - n -> eventually drives the field away from the attractor
# - phi_prime_ini -> 0 causes an artificial instability (alpha_k->0)
#   need to set small value or use a_min_stability_test_smg

# Switch on _smg fluid
Omega_Lambda = 0.
Omega_fld = 0.
Omega_smg = -1.

# For debugging purpouses one can specify a Omega_smg_debug
# AND unspecify Omega_smg,fld,Lambda so no shooting is done
# Omega_smg_debug = -1.

# Gravity model and parameters
gravity_model = quintessence_tracker
# Names:          K_ini, P_ini, V0,  n,  m,  lambda
parameters_smg =      1.,   1., 1., 1., 1.,     15.

# Other parameters:
a_min_stability_test_smg = 1.e-10

# Output:
output = tCl, mPk 

root = output/quintessence_tracker
overwrite_root = yes

output_background_smg = 10
write parameters = yeap
write background = yeah
write thermodynamics = yeahh

input_verbose = 1
background_verbose = 1
thermodynamics_verbose = 1
perturbations_verbose = 1
transfer_verbose = 1
primordial_verbose = 1
harmonic_verbose = 1
fourier_verbose = 1
lensing_verbose = 1
distortions_verbose = 1
output_verbose = 1
